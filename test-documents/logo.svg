<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="A starfield with an orbiting agent">
  <title>Orbit</title>
  <defs>
    <radialGradient id="sky" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1b2b4b"/>
      <stop offset="100%" stop-color="#070b16"/>
    </radialGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4dd0e1" stop-opacity="0"/>
      <stop offset="100%" stop-color="#4dd0e1" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <rect width="240" height="240" rx="18" fill="url(#sky)"/>

  <!-- Far stars -->
  <g fill="#ffffff" opacity="0.55">
    <circle cx="34" cy="42" r="1.4"/>
    <circle cx="196" cy="58" r="1.1"/>
    <circle cx="72" cy="196" r="1.6"/>
    <circle cx="210" cy="176" r="1.2"/>
    <circle cx="128" cy="26" r="1"/>
    <circle cx="22" cy="132" r="1.3"/>
  </g>

  <!-- Orbit path and the agent riding it -->
  <circle cx="120" cy="120" r="66" fill="none" stroke="#2f4468" stroke-width="1.5" stroke-dasharray="4 6"/>
  <path d="M120 54a66 66 0 0 1 46.7 112.7" fill="none" stroke="url(#trail)" stroke-width="4" stroke-linecap="round"/>

  <circle cx="120" cy="120" r="24" fill="#ffb74d"/>
  <circle cx="120" cy="120" r="24" fill="none" stroke="#ffe0b2" stroke-width="1.5" opacity="0.7"/>
  <circle cx="166.7" cy="166.7" r="9" fill="#4dd0e1"/>

  <text x="120" y="226" font-family="system-ui, sans-serif" font-size="12" fill="#8aa0c0" text-anchor="middle">
    self-contained SVG
  </text>
</svg>
