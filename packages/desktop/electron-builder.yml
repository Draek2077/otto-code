  - { ext: cs, name: Otto, role: Editor }
  - { ext: ex, name: Otto, role: Editor }
  - { ext: exs, name: Otto, role: Editor }
  - { ext: md, name: Otto, role: Editor }
  - { ext: mdx, name: Otto, role: Editor }
  - { ext: markdown, name: Otto, role: Editor }
