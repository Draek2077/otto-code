npmRebuild: false
appId: ai.ottocode.desktop
productName: Otto
executableName: Otto
# LegalCopyright in the Windows exe/installer version block and the copyright
# line on macOS. Left blank, this field falls back to an empty/Electron-default
# value, which reads as "unknown origin" in the file's Properties > Details tab.
copyright: "Copyright © 2026 Draekz. Licensed under AGPL-3.0-or-later."
# Registers otto:// with the OS so agent deep links reach the app. main.ts
# handles them via 'open-url' (macOS) and second-instance argv (Windows/Linux).
protocols:
  - name: Otto agent link
    schemes:
      - otto
# Keep this list aligned with highlight/src/parsers.ts and the rendered document
# extensions in app/src/components/file-pane-render-mode.ts. These are an
# additional Open With choice; Otto is not installed as the OS default editor.
fileAssociations:
  - { ext: js, name: Otto, role: Editor }
  - { ext: jsx, name: Otto, role: Editor }
  - { ext: ts, name: Otto, role: Editor }
  - { ext: tsx, name: Otto, role: Editor }
  - { ext: mjs, name: Otto, role: Editor }
  - { ext: cjs, name: Otto, role: Editor }
  - { ext: c, name: Otto, role: Editor }
  - { ext: h, name: Otto, role: Editor }
  - { ext: cc, name: Otto, role: Editor }
  - { ext: cpp, name: Otto, role: Editor }
  - { ext: cxx, name: Otto, role: Editor }
  - { ext: hpp, name: Otto, role: Editor }
  - { ext: hxx, name: Otto, role: Editor }
  - { ext: m, name: Otto, role: Editor }
  - { ext: mm, name: Otto, role: Editor }
  - { ext: json, name: Otto, role: Editor }
  - { ext: css, name: Otto, role: Editor }
  - { ext: scss, name: Otto, role: Editor }
  - { ext: html, name: Otto, role: Editor }
