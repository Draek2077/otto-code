afterPack: ./scripts/after-pack.js
beforePack: ./scripts/before-pack.js
afterSign: ./scripts/after-sign.js
directories:
  output: release
files:
  - dist/**/*
  - "!**/*.map"
  - "!node_modules/@otto-code/*/src/**"
  - "!node_modules/@otto-code/**/*.test.*"
  - "!node_modules/@otto-code/**/*.spec.*"
  - "!node_modules/@otto-code/server/dist/server/web-ui/**"
asarUnpack:
  - dist/daemon/node-entrypoint-runner.js
  - node_modules/@otto-code/server/dist/server/terminal/shell-integration/**/*
  # The daemon owns connector credentials. Keep the keyring bridge and its
  # platform-specific N-API binary outside app.asar so Node can load it.
  - node_modules/@napi-rs/keyring/**/*
  - node_modules/@napi-rs/keyring-*/**/*
extraResources:
  - from: ../app/dist
    to: app-dist
  - from: ../expo-two-way-audio/models/wake-word
    to: wake-word
  - from: ../expo-two-way-audio/wake-word-model.json
    to: wake-word/model.json
  - from: ../../vendor/agent-flow/LICENSE
    to: wake-word/LICENSE-APACHE-2.0.txt
  - from: ../../skills
    to: skills
  - from: assets/tray-icon.png
    to: tray-icon.png
  - from: assets/tray-icon-attention.png
    to: tray-icon-attention.png
  - from: assets/tray-icon-mac.png
    to: tray-icon-mac.png
  - from: assets/tray-icon-mac@2x.png
    to: tray-icon-mac@2x.png
  - from: assets/tray-icon-mac-attention.png
    to: tray-icon-mac-attention.png
  - from: assets/tray-icon-mac-attention@2x.png
    to: tray-icon-mac-attention@2x.png
publish:
  provider: github
  owner: Draek2077
  repo: otto-code
mac:
  artifactName: "Otto-${version}-${arch}.${ext}"
  category: public.app-category.developer-tools
  icon: assets/icon.icns
  hardenedRuntime: true
  notarize: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  extendInfo:
    CFBundleDocumentTypes:
      - CFBundleTypeRole: Editor
        CFBundleTypeName: Folder
        LSItemContentTypes:
          - public.folder
  extraResources:
    - from: bin/otto
      to: bin/otto
  target:
    - dmg
    - zip
linux:
  category: Development
  icon: assets
  artifactName: "Otto-${version}-${arch}.${ext}"
  maintainer: "Draekz <https://github.com/Draek2077>"
  vendor: "Otto"
  # Electron derives the running window's Linux app id (X11 WM_CLASS / Wayland
  # app_id) from the packaged app.asar's package.json "name" field, sanitized -
  # "@otto-code/desktop" becomes "otto-code-desktop" - not from productName or
  # StartupWMClass. Without this override the generated .desktop entry's default
  # StartupWMClass (productName, "Otto") never matches, so GNOME/KDE/Cinnamon
  # treat the launcher and the running window as unrelated: the taskbar/dock
  # icon detaches and every launch opens a fresh, unpinned instance. See the
  # "Taskbar/dock icon detached" gotcha in docs/desktop-linux.md.
  desktop:
    entry:
      StartupWMClass: otto-code-desktop
      # Best-effort folder association. Nautilus and some other Linux file
      # managers do not consistently show non-default directory handlers.
      MimeType: inode/directory;
  extraResources:
    - from: resources/zoom-recorder/bin/${arch}
      to: zoom-recorder
    - from: bin/otto
      to: bin/otto
    # AppArmor profile installed to /etc/apparmor.d/otto by after-install.sh so
    # Chromium's sandbox works under Ubuntu 24.04's unprivileged-userns lockdown.
    - from: build/linux/apparmor/otto
      to: apparmor/otto
  target:
    - AppImage
    - deb
    - rpm
    - tar.gz
deb:
  afterInstall: build/linux/after-install.sh
  afterRemove: build/linux/after-remove.sh
rpm:
  afterInstall: build/linux/after-install.sh
  afterRemove: build/linux/after-remove.sh
appImage:
  # Keep the AppImage filename stable across versions (no ${version}) so
  # electron-updater overwrites the file in place instead of renaming it to a new
  # versioned path. A rename orphans the old binary, breaks desktop shortcuts, and
  # dangles the ~/.local/bin/otto CLI symlink, which points at $APPIMAGE. The
  # version stays discoverable via the release tag and the in-app version.
  artifactName: "Otto-${arch}.${ext}"
win:
  artifactName: "Otto-Setup-${version}-${arch}.${ext}"
  icon: assets/icon.ico
  extraResources:
    - from: resources/zoom-recorder/bin/${arch}
      to: zoom-recorder
    - from: bin/otto.cmd
      to: bin/otto.cmd
  target:
    - target: nsis
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  include: build/installer.nsh
