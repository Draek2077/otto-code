apply plugin: 'com.android.library'

group = 'expo.modules.twowayaudio'
version = '0.1.0'

def expoModulesCorePlugin = new File(project(":expo-modules-core").projectDir.absolutePath, "ExpoModulesCorePlugin.gradle")
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()
useCoreDependencies()
useExpoPublishing()

import groovy.json.JsonSlurper
import java.security.MessageDigest

// If you want to use the managed Android SDK versions from expo-modules-core, set this to true.
// The Android SDK versions will be bumped from time to time in SDK releases and may introduce breaking changes in your module code.
// Most of the time, you may like to manage the Android SDK versions yourself.
def useManagedAndroidSdkVersions = false
if (useManagedAndroidSdkVersions) {
  useDefaultAndroidSdkVersions()
} else {
  buildscript {
    // Simple helper that allows the root project to override versions declared by this library.
    ext.safeExtGet = { prop, fallback ->
      rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
    }
  }
  project.android {
    compileSdkVersion safeExtGet("compileSdkVersion", 34)
    defaultConfig {
      minSdkVersion safeExtGet("minSdkVersion", 21)
      targetSdkVersion safeExtGet("targetSdkVersion", 34)
    }
  }
}

android {
  namespace "expo.modules.twowayaudio"
  sourceSets {
    main {
      // Package the shared, checksum-pinned model as assets/wake-word/*.
      assets.srcDir file("../models")
      assets.srcDir file("$buildDir/generated/wake-word-assets")
      // sherpa-onnx native libs, unpacked from the pinned AAR (see below).
      jniLibs.srcDir file("$buildDir/generated/sherpa-onnx/jni")
    }
  }
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

// AGP forbids direct local .aar file dependencies in library modules
// ("bundleDebugAar: hasLocalAarDeps"), so the pinned sherpa-onnx runtime is
// unpacked at build time into a plain classes.jar (a file dependency, which is
// allowed) plus its jni/ tree wired in as a jniLibs source dir (see the
// android block above). Both are derived from the checksum-verified AAR in
// libs/, so nothing new is committed.
def sherpaAar = file("libs/sherpa-onnx-1.12.28.aar")
def unpackSherpaOnnx = tasks.register("unpackSherpaOnnx", Copy) {
  from { zipTree(sherpaAar) }
  into file("$buildDir/generated/sherpa-onnx")
}

dependencies {
  // A plain .jar file dep (allowed in library modules unlike a local .aar),
  // unpacked from the pinned AAR by the task above.
  implementation files("$buildDir/generated/sherpa-onnx/classes.jar")
  testImplementation "junit:junit:4.13.2"
}

// Ensure the unpack runs before any compile task that needs the jar.
tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
  dependsOn unpackSherpaOnnx
}

def sha256 = { File input ->
  def digest = MessageDigest.getInstance("SHA-256")
  input.withInputStream { stream ->
    byte[] buffer = new byte[8192]
    int read
    while ((read = stream.read(buffer)) != -1) {
      digest.update(buffer, 0, read)
    }
  }
  digest.digest().collect { String.format("%02x", it) }.join()
}

def verifyWakeWordDistribution = tasks.register("verifyWakeWordDistribution") {
  group = "verification"
  description = "Verifies the bundled Hey Otto model and Android Sherpa runtime."

  doLast {
    def manifestFile = file("../wake-word-model.json")
    def manifest = new JsonSlurper().parse(manifestFile)
    manifest.assets.values().each { String assetName ->
      def asset = file("../models/wake-word/${assetName}")
      if (!asset.isFile()) {
        throw new GradleException("Missing wake-word asset: ${asset}")
      }
      if (asset.length() != manifest.assetBytes[assetName]) {
        throw new GradleException("Wake-word asset size mismatch: ${assetName}")
      }
      if (sha256(asset) != manifest.assetSha256[assetName]) {
        throw new GradleException("Wake-word asset checksum mismatch: ${assetName}")
      }
    }

    def androidRuntime = file("../${manifest.androidRuntime.file}")
    if (!androidRuntime.isFile()) {
      throw new GradleException("Missing Android Sherpa runtime: ${androidRuntime}")
    }
    if (androidRuntime.length() != manifest.androidRuntime.bytes) {
      throw new GradleException("Android Sherpa runtime size mismatch")
    }
    if (sha256(androidRuntime) != manifest.androidRuntime.sha256) {
      throw new GradleException("Android Sherpa runtime checksum mismatch")
    }
  }
}

def prepareWakeWordLegalAssets = tasks.register("prepareWakeWordLegalAssets", Sync) {
  dependsOn verifyWakeWordDistribution
  into file("$buildDir/generated/wake-word-assets/wake-word")
  from("../wake-word-model.json") {
    rename { "model.json" }
  }
  from("../../../vendor/agent-flow/LICENSE") {
    rename { "LICENSE-APACHE-2.0.txt" }
  }
}

tasks.named("preBuild").configure {
  dependsOn prepareWakeWordLegalAssets
  dependsOn unpackSherpaOnnx
}
