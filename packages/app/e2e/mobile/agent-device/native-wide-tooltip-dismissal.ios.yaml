# OTTO(usage-popup): dismiss the click-open usage popup on native.
appId: sh.paseo.debug
---
- launchApp
- runFlow:
    when:
      visible: ".*getRegistrationInfoAsync.*"
    commands:
      - tapOn: ".*getRegistrationInfoAsync.*"
      - tapOn: Dismiss
- assertNotVisible: ".*getRegistrationInfoAsync.*"
- extendedWaitUntil:
    visible:
      id: context-window-meter
    timeout: 30000
- tapOn:
    id: context-window-meter
- assertVisible:
    id: context-window-popup
- tapOn:
    id: context-window-popup-backdrop
- assertNotVisible:
    id: context-window-popup
- tapOn:
    id: context-window-meter
- assertVisible:
    id: context-window-popup
- tapOn:
    id: context-window-popup-backdrop
- assertNotVisible:
    id: context-window-popup
