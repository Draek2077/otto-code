# NOTE: Maestro requires a config section for every flow file, even when used
# via `runFlow`. Keep this aligned with the dev build application id.
#
# The host below is the repo DEV daemon (6788), not the installed app's daemon
# (6868) - see docs/development.md. Point it at 6868 only when you deliberately
# want the simulator driving your real `~/.otto` agents.
appId: me.ottocode.mobile
---
- launchApp:
    clearState: true
- runFlow: launch.yaml

- extendedWaitUntil:
    visible:
      id: "welcome-screen"
    timeout: 30000

- tapOn:
    id: "welcome-direct-connection"

- extendedWaitUntil:
    visible:
      id: "add-host-modal"
    timeout: 10000

- tapOn:
    id: "direct-host-input"
- eraseText
- inputText: "127.0.0.1:6788"

- assertVisible:
    id: "direct-host-input"
    text: "127.0.0.1:6788"

- tapOn:
    id: "direct-host-submit"

- extendedWaitUntil:
    visible:
      id: "message-input-root"
    timeout: 60000

- assertVisible:
    id: "message-input-attach-button"
