name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # CI does not use the CUDA execution provider, and the onnxruntime-node
  # postinstall download from NuGet is large enough to make npm ci flaky.
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      quality: ${{ steps.filter.outputs.shared != 'false' || steps.filter.outputs.quality != 'false' }}
      server: ${{ steps.filter.outputs.shared != 'false' || steps.filter.outputs.server != 'false' }}
      desktop: ${{ steps.filter.outputs.shared != 'false' || steps.filter.outputs.desktop != 'false' }}
      desktop_package: ${{ steps.filter.outputs.shared != 'false' || steps.filter.outputs.desktop_package != 'false' }}
      app: ${{ steps.filter.outputs.shared != 'false' || steps.filter.outputs.app != 'false' }}
      android_native: ${{ steps.filter.outputs.shared != 'false' || steps.filter.outputs.android_native != 'false' }}
      sdk: ${{ steps.filter.outputs.shared != 'false' || steps.filter.outputs.sdk != 'false' }}
      playwright: ${{ steps.filter.outputs.shared != 'false' || steps.filter.outputs.playwright != 'false' }}
      relay: ${{ steps.filter.outputs.shared != 'false' || steps.filter.outputs.relay != 'false' }}
      cli: ${{ steps.filter.outputs.shared != 'false' || steps.filter.outputs.cli != 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect affected CI jobs
        id: filter
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          filters: |
            shared:
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
              - '.mise.toml'
              - '.tool-versions'
              - 'package.json'
              - 'package-lock.json'
              - 'patches/**'
              - 'scripts/**'
              - 'tsconfig.json'
              - 'tsconfig.base.json'
              - 'vitest.config.ts'
            quality:
              - 'packages/**'
              - '*.cjs'
              - '*.js'
              - '*.json'
              - '*.mjs'
              - '*.ts'
            server:
              - 'packages/app/e2e/fixtures/recording.*'
              - 'packages/client/**'
              - 'packages/cli/src/**'
              - 'packages/highlight/**'
              - 'packages/protocol/**'
              - 'packages/relay/**'
              - 'packages/server/**'
            desktop:
              - 'packages/app/**'
              - 'packages/cli/**'
              - 'packages/client/**'
              - 'packages/desktop/**'
              - 'packages/expo-two-way-audio/**'
              - 'packages/highlight/**'
              - 'packages/protocol/**'
              - 'packages/relay/**'
              - 'packages/server/**'
            desktop_package:
              - '.github/workflows/ci.yml'
              - 'packages/desktop/**'
              - 'packages/expo-two-way-audio/**'
              - 'vendor/agent-flow/LICENSE'
            app:
              - 'packages/app/**'
              - 'packages/client/**'
              - 'packages/expo-two-way-audio/**'
              - 'packages/highlight/**'
              - 'packages/protocol/**'
              - 'packages/relay/**'
            android_native:
              - '.github/workflows/ci.yml'
              - 'packages/app/android/**'
              - 'packages/expo-two-way-audio/**'
              - 'vendor/agent-flow/LICENSE'
            sdk:
              - 'packages/client/**'
              - 'packages/protocol/**'
              - 'packages/relay/**'
            playwright:
              - 'packages/app/**'
              - 'packages/client/**'
              - 'packages/expo-two-way-audio/**'
              - 'packages/highlight/**'
              - 'packages/protocol/**'
              - 'packages/relay/**'
              - 'packages/server/**'
            relay:
              - 'packages/relay/**'
            cli:
              - 'nix/**'
              - 'packages/app/e2e/global-setup.ts'
              - 'packages/cli/**'
              - 'packages/client/**'
              - 'packages/desktop/src/daemon/runtime-paths.ts'
              - 'packages/highlight/**'
              - 'packages/protocol/**'
              - 'packages/relay/**'
              - 'packages/server/**'

      - name: Validate CI workflow
        run: node --test scripts/ci-workflow.test.mjs

  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # This job never executes Electron. Skipping the hosted binary avoids
      # unrelated npm ci failures when Electron's CDN returns 504.
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: node scripts/npm-retry.mjs ci

      - name: Check formatting
        run: npx oxfmt --check .

  lint:
    needs: changes
    if: >-
      ${{ !cancelled() &&
          (github.event_name == 'workflow_dispatch' ||
           needs.changes.result != 'success' ||
           needs.changes.outputs.quality != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      # Pure file analysis (no deps, under a second), so it runs before install
      # and fails fast. docs/testing.md promises this gate; without it the E2E
      # coverage matrix silently drifts, which is how 21 imported specs reached
      # main unmapped.
      - name: Check E2E coverage matrix
        run: npm run e2e:coverage

      - name: Install dependencies
        run: node scripts/npm-retry.mjs ci

      - name: Lint lockfile
        run: npx --yes lockfile-lint --path package-lock.json --type npm --allowed-hosts npm --validate-https --validate-integrity

      - name: Verify dependency signatures
        run: npm audit signatures

      - name: Lint
        run: npm run lint

  typecheck:
    needs: changes
    if: >-
      ${{ !cancelled() &&
          (github.event_name == 'workflow_dispatch' ||
           needs.changes.result != 'success' ||
           needs.changes.outputs.quality != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: node scripts/npm-retry.mjs ci
      - name: Build server stack
        run: npm run build:server

      - name: Typecheck all packages
        run: npm run typecheck

      - name: Verify public package contents
        run: |
          npm pack --dry-run --ignore-scripts --workspace=@otto-code/protocol
          npm pack --dry-run --ignore-scripts --workspace=@otto-code/client
          npm pack --dry-run --ignore-scripts --workspace=@otto-code/server

  server-tests:
    needs: changes
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    name: server-tests (${{ matrix.os }})
    # A green run finishes in under 16 minutes on the slower of the two
    # platforms. Without a cap, a suite that prints its results and then fails
    # to exit on a leaked handle sits here until GitHub's 360-minute default,
    # which is how one bad merge burned two runners for an afternoon.
    timeout-minutes: 30
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      RUN_TESTS: >-
        ${{ github.event_name == 'workflow_dispatch' ||
            needs.changes.result != 'success' ||
            needs.changes.outputs.server != 'false' }}
    steps:
      - name: Skip unaffected server tests
        if: env.RUN_TESTS != 'true'
        run: echo "No server changes detected."

      - uses: actions/checkout@v7.0.1
        if: env.RUN_TESTS == 'true'
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        if: env.RUN_TESTS == 'true'
        with:
          node-version: "24"
          cache: "npm"

      - name: Fetch origin/main (worktree tests)
        if: env.RUN_TESTS == 'true'
        run: git fetch --no-tags origin main:refs/remotes/origin/main

      - name: Install dependencies
        if: env.RUN_TESTS == 'true'
        run: node scripts/npm-retry.mjs ci
      - name: Install agent CLIs for provider tests
        if: env.RUN_TESTS == 'true'
        run: node scripts/npm-retry.mjs install -g @anthropic-ai/claude-code opencode-ai

      - name: Build server dependencies
        if: env.RUN_TESTS == 'true'
        run: npm run build:server-deps

      - name: Run server tests
        if: env.RUN_TESTS == 'true' && matrix.os != 'windows-latest'
        run: npm run test --workspace=@otto-code/server
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      # DIAG(windows-fork-crash): the Node 24 fs-event assertion happens as
      # Vitest tears down one of several fork workers, after every assertion
      # has passed. The server config deliberately defaults to serial files,
      # but test:unit's --fileParallelism CLI flag overrides it. Keep the
      # Windows suite in a single fork instead of retrying the same unsafe
      # worker topology. Worker threads are not viable either: Node 24 aborts
      # in fs-event.c while the suite starts its watcher.
      - name: Run server tests (Windows)
        if: env.RUN_TESTS == 'true' && matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $attempts = 2
          for ($i = 1; $i -le $attempts; $i++) {
            npm run test:unit --workspace=@otto-code/server -- --maxWorkers=1
            if ($LASTEXITCODE -eq 0) { break }
            if ($i -eq $attempts) { exit $LASTEXITCODE }
            Write-Host "server test:unit failed (attempt $i/$attempts) - retrying the single-fork runner"
          }
          npm run test:integration --workspace=@otto-code/server
          exit $LASTEXITCODE
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NODE_OPTIONS: --require ${{ github.workspace }}\scripts\vitest-kill-diag.cjs
          OTTO_KILL_DIAG_FILE: ${{ runner.temp }}\kill-diag.jsonl

      # DIAG(windows-fork-crash): dump the ledger so the job log carries it.
      - name: Print worker kill diagnostics
        if: always() && env.RUN_TESTS == 'true' && matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $diag = Join-Path $env:RUNNER_TEMP 'kill-diag.jsonl'
          if (Test-Path $diag) { Get-Content $diag } else { Write-Host 'no kill-diag file was written' }

  desktop-tests:
    needs: changes
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      RUN_TESTS: >-
        ${{ github.event_name == 'workflow_dispatch' ||
            needs.changes.result != 'success' ||
            needs.changes.outputs.desktop != 'false' }}
    steps:
      - name: Skip unaffected desktop tests
        if: env.RUN_TESTS != 'true'
        run: echo "No desktop changes detected."

      - uses: actions/checkout@v7.0.1
        if: env.RUN_TESTS == 'true'

      - uses: actions/setup-node@v7
        if: env.RUN_TESTS == 'true'
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies with retry
        if: env.RUN_TESTS == 'true'
        run: node scripts/npm-retry.mjs ci

      - name: Setup Python for Linux recorder packaging
        if: env.RUN_TESTS == 'true' && matrix.os == 'ubuntu-latest'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packages/desktop/resources/zoom-recorder/requirements-build.txt

      - name: Install Zoom Recorder build dependencies
        if: env.RUN_TESTS == 'true' && matrix.os == 'ubuntu-latest'
        run: python -m pip install -r packages/desktop/resources/zoom-recorder/requirements-build.txt
      - name: Build server stack
        if: env.RUN_TESTS == 'true'
        run: npm run build:server

      - name: Run desktop tests
        if: env.RUN_TESTS == 'true'
        run: npm run test --workspace=@otto-code/desktop

      - name: Build app dependencies for desktop E2E
        if: env.RUN_TESTS == 'true' && matrix.os == 'ubuntu-latest'
        run: npm run build:app-deps

      - name: Install virtual display
        if: env.RUN_TESTS == 'true' && matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth

      - name: Run real Electron browser tab bridge E2E
        if: env.RUN_TESTS == 'true' && matrix.os == 'ubuntu-latest'
        run: npm run test:e2e:browser-tab-bridge --workspace=@otto-code/desktop
        env:
          OTTO_TAB_BRIDGE_E2E_ARTIFACT_DIR: ${{ runner.temp }}/browser-tab-bridge-e2e

      - name: Upload browser tab bridge diagnostics
        uses: actions/upload-artifact@v7
        if: env.RUN_TESTS == 'true' && failure() && matrix.os == 'ubuntu-latest'
        with:
          name: browser-tab-bridge-e2e
          path: ${{ runner.temp }}/browser-tab-bridge-e2e
          if-no-files-found: ignore
          retention-days: 7

      - name: Build and smoke unpacked desktop app
        if: >-
          env.RUN_TESTS == 'true' && matrix.os == 'ubuntu-latest' &&
          (github.event_name == 'workflow_dispatch' ||
           needs.changes.result != 'success' ||
           needs.changes.outputs.desktop_package != 'false')
        run: npm run build:desktop -- --publish never --linux --x64 --dir
        env:
          EP_GH_IGNORE_TIME: true
          OTTO_DESKTOP_SMOKE: "1"
          OTTO_DESKTOP_SMOKE_ARTIFACT_DIR: ${{ runner.temp }}/desktop-smoke

      - name: Upload packaged smoke diagnostics
        if: >-
          env.RUN_TESTS == 'true' && failure() && matrix.os == 'ubuntu-latest' &&
          (github.event_name == 'workflow_dispatch' ||
           needs.changes.result != 'success' ||
           needs.changes.outputs.desktop_package != 'false')
        uses: actions/upload-artifact@v7
        with:
          name: desktop-packaged-smoke-linux-x64
          path: ${{ runner.temp }}/desktop-smoke
          if-no-files-found: ignore
          retention-days: 7

  app-tests:
    needs: changes
    if: >-
      ${{ !cancelled() &&
          (github.event_name == 'workflow_dispatch' ||
           needs.changes.result != 'success' ||
           needs.changes.outputs.app != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies with retry
        run: node scripts/npm-retry.mjs ci
      - name: Install Playwright browsers
        timeout-minutes: 10
        run: npx playwright install chromium

      - name: Build app dependencies
        run: npm run build:app-deps

      - name: Run app unit tests
        run: npm run test --workspace=@otto-code/app

  android-native-tests:
    needs: changes
    if: >-
      ${{ !cancelled() &&
          (github.event_name == 'workflow_dispatch' ||
           needs.changes.result != 'success' ||
           needs.changes.outputs.android_native != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - uses: actions/setup-java@v5.7.0
        with:
          distribution: "temurin"
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5

      - name: Install dependencies with retry
        run: node scripts/npm-retry.mjs ci

      - name: Build client dependencies
        run: npm run build:client

      - name: Generate the native Android project
        working-directory: packages/app
        env:
          APP_VARIANT: development
        run: npx expo prebuild --platform android --non-interactive

      - name: Compile and test the Android wake-word module
        working-directory: packages/app/android
        run: >-
          ./gradlew
          :otto-code-expo-two-way-audio:testDebugUnitTest
          --tests expo.modules.twowayaudio.WakeWordHandoffBufferTest
          --no-daemon

  sdk-tests:
    needs: changes
    if: >-
      ${{ !cancelled() &&
          (github.event_name == 'workflow_dispatch' ||
           needs.changes.result != 'success' ||
           needs.changes.outputs.sdk != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: node scripts/npm-retry.mjs ci
      - name: Build client dependencies
        run: npm run build:client

      - name: Run protocol tests
        run: npm run test --workspace=@otto-code/protocol

      - name: Run client tests
        run: npm run test --workspace=@otto-code/client

      - name: Typecheck client examples
        run: npm run typecheck:examples --workspace=@otto-code/client

  playwright:
    needs: changes
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: "shard 1/8", shard: 1, desktop: false }
          - { label: "shard 2/8", shard: 2, desktop: false }
          - { label: "shard 3/8", shard: 3, desktop: false }
          - { label: "shard 4/8", shard: 4, desktop: false }
          - { label: "shard 5/8", shard: 5, desktop: false }
          - { label: "shard 6/8", shard: 6, desktop: false }
          - { label: "shard 7/8", shard: 7, desktop: false }
          - { label: "shard 8/8", shard: 8, desktop: false }
          - { label: "desktop overlay", shard: "desktop", desktop: true }
    name: playwright (${{ matrix.label }})
    runs-on: ubuntu-latest
    # The suite is ~370 tests at roughly 26 seconds each on a hosted runner, and
    # `workers: 1` in playwright.config.ts is deliberate (the specs share one
    # daemon/relay/Metro stack). That is ~2.7 hours of serial work: at 4 shards a
    # single shard needs ~45 minutes of test time on top of ~5 minutes of job
    # setup, so the old 35-minute cap killed every shard mid-run and the tier had
    # never once completed. Eight shards puts a shard around 22 minutes; the cap
    # stays well above that so a genuinely hung suite still cannot run for hours.
    timeout-minutes: 65
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      # Stay below `timeout-minutes` above. When a shard runs past the job cap the
      # runner SIGKILLs it, and a killed shard reports nothing at all: you learn it
      # was cancelled and not one word about which tests failed. That is how this
      # tier stayed undiagnosed after the v0.2.5 merge. Playwright's own global
      # timeout ends the run cleanly and still prints the results it has, so it is
      # the one that should fire first. The job cap stays as the backstop for a
      # process wedged too hard for Playwright to report at all.
      #
      # The margin is wide because the cap covers job setup (install, browsers,
      # two builds) as well as the run itself.
      E2E_GLOBAL_TIMEOUT_MINUTES: "55"
      RUN_TESTS: >-
        ${{ github.event_name == 'workflow_dispatch' ||
            needs.changes.result != 'success' ||
            needs.changes.outputs.playwright != 'false' }}
    steps:
      - name: Skip unaffected Playwright tests
        if: env.RUN_TESTS != 'true'
        run: echo "No Playwright changes detected."

      - uses: actions/checkout@v7.0.1
        if: env.RUN_TESTS == 'true'

      - uses: actions/setup-node@v7
        if: env.RUN_TESTS == 'true'
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies with retry
        if: env.RUN_TESTS == 'true'
        run: node scripts/npm-retry.mjs ci
      - name: Install Playwright browsers
        if: env.RUN_TESTS == 'true'
        timeout-minutes: 10
        run: npx playwright install chromium

      - name: Build app dependencies
        if: env.RUN_TESTS == 'true'
        run: npm run build:app-deps

      - name: Build server stack
        if: env.RUN_TESTS == 'true'
        run: npm run build:server

      - name: Install agent CLIs for provider tests
        if: env.RUN_TESTS == 'true' && !matrix.desktop
        run: node scripts/npm-retry.mjs install -g @anthropic-ai/claude-code @openai/codex@0.105.0 opencode-ai

      - name: Run Playwright E2E tests
        if: env.RUN_TESTS == 'true' && !matrix.desktop
        run: npm run test:e2e --workspace=@otto-code/app -- --shard=${{ matrix.shard }}/8
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Run desktop-overlay Playwright tests
        if: env.RUN_TESTS == 'true' && matrix.desktop
        run: npm run test:e2e:desktop --workspace=@otto-code/app

      - name: Upload test artifacts
        uses: actions/upload-artifact@v7
        if: env.RUN_TESTS == 'true' && failure()
        with:
          name: playwright-results-${{ matrix.shard }}
          path: |
            packages/app/test-results/
            packages/app/playwright-report/
          retention-days: 7

  relay-tests:
    needs: changes
    if: >-
      ${{ !cancelled() &&
          (github.event_name == 'workflow_dispatch' ||
           needs.changes.result != 'success' ||
           needs.changes.outputs.relay != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: node scripts/npm-retry.mjs ci

      - name: Build relay
        run: npm run build:relay

      - name: Run relay tests
        run: npm run test --workspace=@otto-code/relay

  cli-tests:
    needs: changes
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: ubuntu-latest
    name: cli-tests (shard ${{ matrix.shard }}/3)
    timeout-minutes: 25
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      RUN_TESTS: >-
        ${{ github.event_name == 'workflow_dispatch' ||
            needs.changes.result != 'success' ||
            needs.changes.outputs.cli != 'false' }}
    steps:
      - name: Skip unaffected CLI tests
        if: env.RUN_TESTS != 'true'
        run: echo "No CLI changes detected."

      - uses: actions/checkout@v7.0.1
        if: env.RUN_TESTS == 'true'

      - uses: actions/setup-node@v7
        if: env.RUN_TESTS == 'true'
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        if: env.RUN_TESTS == 'true'
        run: node scripts/npm-retry.mjs ci

      - name: Build server stack
        if: env.RUN_TESTS == 'true'
        run: npm run build:server

      - name: Install agent CLIs for provider tests
        if: env.RUN_TESTS == 'true'
        run: node scripts/npm-retry.mjs install -g @anthropic-ai/claude-code @openai/codex@0.105.0 opencode-ai

      - name: Run CLI tests
        if: env.RUN_TESTS == 'true'
        run: npm run test --workspace=@otto-code/cli
        env:
          OTTO_LOCAL_SPEECH_AUTO_DOWNLOAD: "0"
          OTTO_DICTATION_ENABLED: "0"
          OTTO_VOICE_MODE_ENABLED: "0"
          OTTO_CLI_TEST_SHARD: ${{ matrix.shard }}
          OTTO_CLI_TEST_SHARD_TOTAL: "3"
