name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # CI does not use the CUDA execution provider, and the onnxruntime-node
  # postinstall download from NuGet is large enough to make npm ci flaky.
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  format:
    runs-on: ubuntu-latest
    env:
      # This job never executes Electron. Skipping the hosted binary avoids
      # unrelated npm ci failures when Electron's CDN returns 504.
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npx oxfmt --check .

  lint:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      # Rides the lint job rather than owning one: the check is pure file
      # analysis over the coverage matrix and packages/app/e2e, needs no
      # dependencies, and finishes in well under a second — a dedicated job
      # would spend a minute of npm ci to run it. Placed before `npm ci` so it
      # fails fast and still reports drift when installation is broken.
      # It lives in CI rather than the pre-commit hook on purpose: the hook is
      # shared by every parallel session in a working tree, and this guard has
      # to compare the whole spec directory against the whole matrix, so it
      # could not be scoped to staged files anyway.
      - name: E2E coverage matrix drift
        run: node scripts/e2e-coverage-check.mjs

      - name: Install dependencies
        run: npm ci

      - name: Lint lockfile
        run: npx --yes lockfile-lint --path package-lock.json --type npm --allowed-hosts npm --validate-https --validate-integrity

      - name: Verify dependency signatures
        run: npm audit signatures

      - name: Lint
        run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci
      - name: Build server stack
        run: npm run build:server

      - name: Typecheck all packages
        run: npm run typecheck

      - name: Verify public package contents
        run: |
          npm pack --dry-run --ignore-scripts --workspace=@otto-code/protocol
          npm pack --dry-run --ignore-scripts --workspace=@otto-code/client
          npm pack --dry-run --ignore-scripts --workspace=@otto-code/server

  # One step, one payload. The sidecar is framework-dependent IL, so there is no per-RID matrix
  # and no runtime restore — building on Linux produces the artifact that runs on all three
  # platforms. The job asserts that, rather than trusting it: it publishes, then drives the real
  # NDJSON protocol against a fixture solution.
  dotnet-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build the solution sidecar
        run: npm run build:dotnet-probe:required

      - name: Verify the payload answers the protocol
        run: node scripts/verify-dotnet-probe.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: dotnet-probe
          path: packages/dotnet-probe/dist/
          retention-days: 7

  server-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    name: server-tests (${{ matrix.os }})
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Fetch origin/main (worktree tests)
        run: git fetch --no-tags origin main:refs/remotes/origin/main

      - name: Install dependencies
        run: npm ci
      - name: Install agent CLIs for provider tests
        run: npm install -g @anthropic-ai/claude-code opencode-ai

      - name: Build server dependencies
        run: npm run build:server-deps

      - name: Run server tests
        run: npm run test --workspace=@otto-code/server
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

  desktop-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies with Electron retry
        if: runner.os != 'Windows'
        run: |
          for attempt in 1 2 3; do
            if npm ci; then
              exit 0
            else
              exit_code=$?
            fi
            if [ "$attempt" -eq 3 ]; then
              exit $exit_code
            fi
            sleep $((attempt * 20))
          done

      - name: Install dependencies with Electron retry
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            npm ci
            if ($LASTEXITCODE -eq 0) {
              exit 0
            }
            if ($attempt -eq 3) {
              exit $LASTEXITCODE
            }
            Start-Sleep -Seconds (20 * $attempt)
          }
      - name: Build server stack
        run: npm run build:server

      - name: Run desktop tests
        run: npm run test --workspace=@otto-code/desktop

  app-tests:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies with retry
        run: |
          for attempt in 1 2 3; do
            if npm ci; then
              exit 0
            else
              exit_code=$?
            fi
            if [ "$attempt" -eq 3 ]; then
              exit $exit_code
            fi
            sleep $((attempt * 20))
          done
      - name: Install Playwright browsers
        timeout-minutes: 10
        run: npx playwright install chromium

      - name: Build app dependencies
        run: npm run build:app-deps

      - name: Run app unit tests
        run: npm run test --workspace=@otto-code/app

  sdk-tests:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci
      - name: Build client dependencies
        run: npm run build:client

      - name: Run protocol tests
        run: npm run test --workspace=@otto-code/protocol

      - name: Run client tests
        run: npm run test --workspace=@otto-code/client

      - name: Typecheck client examples
        run: npm run typecheck:examples --workspace=@otto-code/client

  playwright:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: "shard 1/4", shard: 1, desktop: false }
          - { label: "shard 2/4", shard: 2, desktop: false }
          - { label: "shard 3/4", shard: 3, desktop: false }
          - { label: "shard 4/4", shard: 4, desktop: false }
          - { label: "desktop overlay", shard: "desktop", desktop: true }
    name: playwright (${{ matrix.label }})
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies with retry
        run: |
          for attempt in 1 2 3; do
            if npm ci; then
              exit 0
            else
              exit_code=$?
            fi
            if [ "$attempt" -eq 3 ]; then
              exit $exit_code
            fi
            sleep $((attempt * 20))
          done
      - name: Install Playwright browsers
        timeout-minutes: 10
        run: npx playwright install chromium

      - name: Build app dependencies
        run: npm run build:app-deps

      - name: Build server stack
        run: npm run build:server

      - name: Install agent CLIs for provider tests
        if: ${{ !matrix.desktop }}
        run: npm install -g @anthropic-ai/claude-code @openai/codex@0.105.0 opencode-ai

      - name: Run Playwright E2E tests
        if: ${{ !matrix.desktop }}
        run: npm run test:e2e --workspace=@otto-code/app -- --shard=${{ matrix.shard }}/4
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Run desktop-overlay Playwright tests
        if: ${{ matrix.desktop }}
        run: npm run test:e2e:desktop --workspace=@otto-code/app

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results-${{ matrix.shard }}
          path: |
            packages/app/test-results/
            packages/app/playwright-report/
          retention-days: 7

  relay-tests:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build relay
        run: npm run build:relay

      - name: Run relay tests
        run: npm run test --workspace=@otto-code/relay

  cli-tests:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: ubuntu-latest
    name: cli-tests (shard ${{ matrix.shard }}/3)
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install agent CLIs for provider tests
        run: npm install -g @anthropic-ai/claude-code @openai/codex@0.105.0 opencode-ai

      - name: Run CLI tests
        run: npm run test --workspace=@otto-code/cli
        env:
          OTTO_LOCAL_SPEECH_AUTO_DOWNLOAD: "0"
          OTTO_DICTATION_ENABLED: "0"
          OTTO_VOICE_MODE_ENABLED: "0"
          OTTO_CLI_TEST_SHARD: ${{ matrix.shard }}
          OTTO_CLI_TEST_SHARD_TOTAL: "3"
