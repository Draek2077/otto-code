name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # CI does not use the CUDA execution provider, and the onnxruntime-node
  # postinstall download from NuGet is large enough to make npm ci flaky.
  ONNXRUNTIME_NODE_INSTALL: skip
  # Keep wrapper and platform binaries on a published, verified release.
  # Floating 1.18.29 failed ETARGET during run 33924801496's provider setup.
  OTTO_CI_OPENCODE_VERSION: "1.18.28"

# Every job runs on every push. There used to be a `changes` job
# (dorny/paths-filter) gating the rest, and the skip was wired as a per-step
# `if:` guard, so an unaffected commit ran a single `echo` and the job reported
# **success**. All eight Playwright shards would go green having executed zero
# tests. The result: between 2026-08-07 and 2026-08-18, 80 consecutive CI runs
# produced 55 failures, 22 cancellations and 3 "successes" - and all 3 of those
# successes had skipped Playwright entirely. A continuously red suite was
# indistinguishable from a healthy one, and 0.8.10 shipped on a cancelled run.
#
# If you reinstate path filtering to save runner minutes, put the condition on
# the *job* (`if:` at job level), never on its steps: a filtered job must report
# `skipped`, never `success`.
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # This job never executes Electron. Skipping the hosted binary avoids
      # unrelated npm ci failures when Electron's CDN returns 504.
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: node scripts/npm-retry.mjs ci

      - name: Check formatting
        run: npx oxfmt --check .

      # This runs here, in the first job, because it is the only check that can
      # catch a workflow GitHub refuses to start at all. It used to live in the
      # `changes` job; that job was deleted on 2026-08-18 and the step went with
      # it, and the same commit left a valueless `env:` key behind. GitHub
      # rejected the file, every push since produced zero jobs and a 0s
      # failure, and nothing said so louder than a red X.
      - name: Validate CI workflow
        run: node --test scripts/ci-workflow.test.mjs scripts/ci-diagnose.test.mjs scripts/browser-download.test.mjs

  lint:
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      # Pure file analysis (no deps, under a second), so it runs before install
      # and fails fast. docs/testing.md promises this gate; without it the E2E
      # coverage matrix silently drifts, which is how 21 imported specs reached
      # main unmapped.
      - name: Check E2E coverage matrix
        run: npm run e2e:coverage

      - name: Check module size ceilings
        run: npm run size:ceilings:check

      - name: Install dependencies
        run: node scripts/npm-retry.mjs ci

      - name: Test merge integration guard
        run: node --test scripts/merge-orphan-guard.test.mjs

      # Advance these pre-merge/upstream pins together when adopting upstream;
      # docs/upstream-merges.md describes the contract review and baseline.
      - name: Check merge integration entry points
        run: >-
          node scripts/merge-orphan-guard.mjs --integrations
          --before b6735559a98d0143d0127814696f35a091860845
          --at 20d7efc46a316f5a274b9943a5c43b0322269825
          --after HEAD --json

      - name: Lint lockfile
        run: npx --yes lockfile-lint --path package-lock.json --type npm --allowed-hosts npm --validate-https --validate-integrity

      - name: Verify dependency signatures
        run: npm audit signatures

      - name: Lint
        run: npm run lint

  typecheck:
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: node scripts/npm-retry.mjs ci
      - name: Build server stack
        run: npm run build:server

      - name: Typecheck all packages
        run: npm run typecheck

      - name: Verify public package contents
        run: |
          npm pack --dry-run --ignore-scripts --workspace=@otto-code/protocol
          npm pack --dry-run --ignore-scripts --workspace=@otto-code/client
          npm pack --dry-run --ignore-scripts --workspace=@otto-code/server

  server-tests:
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    name: server-tests (${{ matrix.os }})
    # A green Linux run finishes in under 16 minutes. Without a cap, a suite
    # that prints its results and then fails to exit on a leaked handle sits
    # here until GitHub's 360-minute default, which is how one bad merge burned
    # two runners for an afternoon. Windows runs the unit suite on a single
    # fork, up to twice, then the integration suite: the v0.9.0 run was killed
    # at 30 minutes as "cancelled" with no test output at all, so it gets 60.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 60 || 30 }}
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Fetch origin/main (worktree tests)
        run: git fetch --no-tags origin main:refs/remotes/origin/main

      - name: Install dependencies
        run: node scripts/npm-retry.mjs ci
      - name: Install agent CLIs for provider tests
        run: node scripts/npm-retry.mjs install -g @anthropic-ai/claude-code opencode-ai@${{ env.OTTO_CI_OPENCODE_VERSION }}
      - name: Report OpenCode version
        run: opencode --version

      - name: Build server dependencies
        run: npm run build:server-deps

      - name: Run server tests
        if: matrix.os != 'windows-latest'
        run: npm run test --workspace=@otto-code/server
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      # DIAG(windows-fork-crash): the Node 24 fs-event assertion happens as
      # Vitest tears down one of several fork workers, after every assertion
      # has passed. The server config deliberately defaults to serial files,
      # but test:unit's --fileParallelism CLI flag overrides it. Keep the
      # Windows suite in a single fork instead of retrying the same unsafe
      # worker topology. Worker threads are not viable either: Node 24 aborts
      # in fs-event.c while the suite starts its watcher.
      - name: Run server tests (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $attempts = 2
          for ($i = 1; $i -le $attempts; $i++) {
            npm run test:unit --workspace=@otto-code/server -- --maxWorkers=1
            if ($LASTEXITCODE -eq 0) { break }
            if ($i -eq $attempts) { exit $LASTEXITCODE }
            Write-Host "server test:unit failed (attempt $i/$attempts) - retrying the single-fork runner"
          }
          npm run test:integration --workspace=@otto-code/server
          exit $LASTEXITCODE
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NODE_OPTIONS: --require ${{ github.workspace }}\scripts\vitest-kill-diag.cjs
          OTTO_KILL_DIAG_FILE: ${{ runner.temp }}\kill-diag.jsonl

      # DIAG(windows-fork-crash): dump the ledger so the job log carries it.
      - name: Print worker kill diagnostics
        if: always() && matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $diag = Join-Path $env:RUNNER_TEMP 'kill-diag.jsonl'
          if (Test-Path $diag) { Get-Content $diag } else { Write-Host 'no kill-diag file was written' }

  desktop-tests:
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies with retry
        run: node scripts/npm-retry.mjs ci

      - name: Setup Python for Linux recorder packaging
        if: matrix.os == 'ubuntu-latest'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packages/desktop/resources/zoom-recorder/requirements-build.txt

      - name: Install Zoom Recorder build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: python -m pip install -r packages/desktop/resources/zoom-recorder/requirements-build.txt
      - name: Build server stack
        run: npm run build:server

      - name: Run desktop tests
        run: npm run test --workspace=@otto-code/desktop

      - name: Build app dependencies for desktop E2E
        if: matrix.os == 'ubuntu-latest'
        run: npm run build:app-deps

      - name: Install virtual display
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth

      - name: Run real Electron browser tab bridge E2E
        if: matrix.os == 'ubuntu-latest'
        run: npm run test:e2e:browser-tab-bridge --workspace=@otto-code/desktop
        env:
          OTTO_TAB_BRIDGE_E2E_ARTIFACT_DIR: ${{ runner.temp }}/browser-tab-bridge-e2e

      - name: Upload browser tab bridge diagnostics
        uses: actions/upload-artifact@v7
        if: failure() && matrix.os == 'ubuntu-latest'
        with:
          name: browser-tab-bridge-e2e
          path: ${{ runner.temp }}/browser-tab-bridge-e2e
          if-no-files-found: ignore
          retention-days: 7

      - name: Build and smoke unpacked desktop app
        if: matrix.os == 'ubuntu-latest'
        run: npm run build:desktop -- --publish never --linux --x64 --dir
        env:
          EP_GH_IGNORE_TIME: true
          OTTO_DESKTOP_SMOKE: "1"
          OTTO_DESKTOP_SMOKE_ARTIFACT_DIR: ${{ runner.temp }}/desktop-smoke
          # Use the system Python installed above; this skips the before-pack
          # hook's venv provisioning (which would install the deps a second time).
          OTTO_ZOOM_RECORDER_PYTHON: python

      - name: Upload packaged smoke diagnostics
        if: failure() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: desktop-packaged-smoke-linux-x64
          path: ${{ runner.temp }}/desktop-smoke
          if-no-files-found: ignore
          retention-days: 7

  app-tests:
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies with retry
        run: node scripts/npm-retry.mjs ci
      - name: Install Playwright browsers
        timeout-minutes: 10
        run: npm run browsers:install

      - name: Build app dependencies
        run: npm run build:app-deps

      - name: Run app unit and browser tests
        run: npm run test --workspace=@otto-code/app

  android-native-tests:
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - uses: actions/setup-java@v5.7.0
        with:
          distribution: "temurin"
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5

      - name: Install dependencies with retry
        run: node scripts/npm-retry.mjs ci

      - name: Build client dependencies
        run: npm run build:client

      - name: Generate the native Android project
        working-directory: packages/app
        env:
          APP_VARIANT: development
        run: npx expo prebuild --platform android --non-interactive

      - name: Compile and test the Android wake-word module
        working-directory: packages/app/android
        run: >-
          ./gradlew
          :otto-code-expo-two-way-audio:testDebugUnitTest
          --tests expo.modules.twowayaudio.WakeWordHandoffBufferTest
          --no-daemon

  sdk-tests:
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: node scripts/npm-retry.mjs ci
      - name: Build client dependencies
        run: npm run build:client

      - name: Run protocol tests
        run: npm run test --workspace=@otto-code/protocol

      - name: Run client tests
        run: npm run test --workspace=@otto-code/client

      - name: Typecheck client examples
        run: npm run typecheck:examples --workspace=@otto-code/client

  playwright:
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: "shard 1/8", shard: 1, desktop: false }
          - { label: "shard 2/8", shard: 2, desktop: false }
          - { label: "shard 3/8", shard: 3, desktop: false }
          - { label: "shard 4/8", shard: 4, desktop: false }
          - { label: "shard 5/8", shard: 5, desktop: false }
          - { label: "shard 6/8", shard: 6, desktop: false }
          - { label: "shard 7/8", shard: 7, desktop: false }
          - { label: "shard 8/8", shard: 8, desktop: false }
          - { label: "desktop overlay", shard: "desktop", desktop: true }
    name: playwright (${{ matrix.label }})
    runs-on: ubuntu-latest
    # The suite is ~370 tests at roughly 26 seconds each on a hosted runner, and
    # `workers: 1` in playwright.config.ts is deliberate (the specs share one
    # daemon/relay/Metro stack). That is ~2.7 hours of serial work: at 4 shards a
    # single shard needs ~45 minutes of test time on top of ~5 minutes of job
    # setup, so the old 35-minute cap killed every shard mid-run and the tier had
    # never once completed. Eight shards puts a shard around 22 minutes; the cap
    # stays well above that so a genuinely hung suite still cannot run for hours.
    timeout-minutes: 65
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      # Stay below `timeout-minutes` above. When a shard runs past the job cap the
      # runner SIGKILLs it, and a killed shard reports nothing at all: you learn it
      # was cancelled and not one word about which tests failed. That is how this
      # tier stayed undiagnosed after the v0.2.5 merge. Playwright's own global
      # timeout ends the run cleanly and still prints the results it has, so it is
      # the one that should fire first. The job cap stays as the backstop for a
      # process wedged too hard for Playwright to report at all.
      #
      # The margin is wide because the cap covers job setup (install, browsers,
      # two builds) as well as the run itself.
      E2E_GLOBAL_TIMEOUT_MINUTES: "55"
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies with retry
        run: node scripts/npm-retry.mjs ci
      - name: Install Playwright browsers
        timeout-minutes: 10
        run: npm run browsers:install

      - name: Build server stack
        run: npm run build:server

      - name: Build native app dependency
        run: npm run build --workspace=@otto-code/expo-two-way-audio

      - name: Install agent CLIs for provider tests
        if: ${{ !matrix.desktop }}
        run: node scripts/npm-retry.mjs install -g @anthropic-ai/claude-code @openai/codex@0.105.0 opencode-ai@${{ env.OTTO_CI_OPENCODE_VERSION }}
      - name: Report OpenCode version
        if: ${{ !matrix.desktop }}
        run: opencode --version

      - name: Run Playwright E2E tests
        if: ${{ !matrix.desktop }}
        run: npm run test:e2e --workspace=@otto-code/app -- --shard=${{ matrix.shard }}/8
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      # The desktop-overlay specs live in packages/desktop/e2e/ (docs/testing.md),
      # not in the app package. They drive the renderer in a plain Chromium with
      # E2E_DESKTOP_RUNTIME=1, so they need this job's Metro/server stack rather
      # than the Electron binary the desktop-tests job builds.
      - name: Run desktop-overlay Playwright tests
        if: ${{ matrix.desktop }}
        run: npm run test:e2e:renderer --workspace=@otto-code/desktop

      - name: Upload test artifacts
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-results-${{ matrix.shard }}
          path: |
            packages/app/test-results/
            packages/app/playwright-report/
            packages/desktop/test-results/
          if-no-files-found: ignore
          retention-days: 7

  relay-tests:
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: node scripts/npm-retry.mjs ci

      - name: Build relay
        run: npm run build:relay

      - name: Run relay tests
        run: npm run test --workspace=@otto-code/relay

  cli-tests:
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: ubuntu-latest
    name: cli-tests (shard ${{ matrix.shard }}/3)
    timeout-minutes: 25
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: node scripts/npm-retry.mjs ci

      - name: Build server stack
        run: npm run build:server

      - name: Install agent CLIs for provider tests
        run: node scripts/npm-retry.mjs install -g @anthropic-ai/claude-code @openai/codex@0.105.0 opencode-ai@${{ env.OTTO_CI_OPENCODE_VERSION }}
      - name: Report OpenCode version
        run: opencode --version

      - name: Run CLI tests
        run: npm run test --workspace=@otto-code/cli
        env:
          OTTO_LOCAL_SPEECH_AUTO_DOWNLOAD: "0"
          OTTO_DICTATION_ENABLED: "0"
          OTTO_VOICE_MODE_ENABLED: "0"
          OTTO_CLI_TEST_SHARD: ${{ matrix.shard }}
          OTTO_CLI_TEST_SHARD_TOTAL: "3"
