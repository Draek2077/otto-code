name: Otto App Acceptance

# OTTO(app-acceptance): app-visible Otto journeys complement the full Paseo CI matrix.
on:
  push:
    branches: [otto-0.10/phase-0]
    paths:
      - .github/workflows/otto-app-acceptance.yml
      - scripts/otto/app-acceptance.test.mjs
      - packages/app/**
      - packages/client/**
      - packages/plugin/**
      - packages/protocol/**
      - packages/server/**
      - packages/otto-brain/**
      - vendor/archify/**
      - plugins/**
      - package.json
      - package-lock.json
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/otto-app-acceptance.yml
      - scripts/otto/app-acceptance.test.mjs
      - packages/app/**
      - packages/client/**
      - packages/plugin/**
      - packages/protocol/**
      - packages/server/**
      - packages/otto-brain/**
      - vendor/archify/**
      - plugins/**
      - package.json
      - package-lock.json
  workflow_dispatch:
    inputs:
      checkout_ref:
        description: Exact source commit to verify; defaults to the selected workflow ref
        type: string
        required: false
      journey:
        description: Manual diagnostic scope; pushes and pull requests always run all journeys
        type: choice
        default: all
        options:
          [
            all,
            knowledge,
            brain-cancellation,
            context-health,
            preview,
            artifacts,
            speech,
            terminal,
            editor,
            workflows,
            schedules,
            architectural-views,
          ]

permissions:
  contents: read

concurrency:
  group: otto-app-acceptance-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.journey || 'all' }}
  cancel-in-progress: true

env:
  ONNXRUNTIME_NODE_INSTALL: skip
  GOMAXPROCS: "2"
  RAYON_NUM_THREADS: "2"

jobs:
  acceptance:
    name: acceptance (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        # Full coverage uses Playwright's own partitioning. Manual single-journey
        # diagnostics retain one serial job and never cancel a full gate.
        shard: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.journey != 'all' && '[1]' || '[1,2]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install existing workspace dependencies
        run: node scripts/npm-retry.mjs ci
      - name: Install browser
        timeout-minutes: 10
        run: npx playwright install chromium
      - name: Install isolated credential test dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends dbus-x11 gnome-keyring libsecret-1-0 vim neovim
      # OTTO(editor): every server/desktop artifact includes the portable solution payload.
      - uses: ./.github/actions/otto-editor-dotnet
      - name: Build server stack
        run: npm run build:server
      - name: Verify OS credential binding without accessing entries
        run: node --input-type=module -e 'const binding = await import("@napi-rs/keyring"); if (typeof binding.Entry !== "function") throw new Error("OS credential binding is unavailable");'
      - name: Build app audio dependency
        run: npm run build --workspace=@getpaseo/expo-two-way-audio
      - name: Verify Otto app journeys
        run: |
          dbus-run-session -- bash -e <<'ACCEPTANCE'
          # OTTO(connectors): test-only OS vault in the disposable CI workspace.
          export XDG_DATA_HOME="$GITHUB_WORKSPACE/.tmp/acceptance-keyring"
          mkdir -p "$XDG_DATA_HOME"
          printf '%s' 'otto-acceptance-fixture' | gnome-keyring-daemon --unlock --components=secrets
          case "$OTTO_ACCEPTANCE_JOURNEY" in
            all)
              npm run test:e2e --workspace=@getpaseo/app -- 'e2e/browser/otto-.*\.spec\.ts$' --workers=1 --retries=0 --max-failures=1 --shard="$OTTO_ACCEPTANCE_SHARD/2"
              ;;
            knowledge)
              npm run test:e2e --workspace=@getpaseo/app -- 'e2e/browser/otto-knowledge.*\.spec\.ts$' --workers=1 --retries=0 --max-failures=1
              ;;
            brain-cancellation)
              npm run test:e2e --workspace=@getpaseo/app -- e2e/browser/otto-brain-operations.spec.ts --grep='canceling a running benchmark' --repeat-each=3 --workers=1 --retries=0 --max-failures=1
              ;;
            context-health)
              npm run test:e2e --workspace=@getpaseo/app -- e2e/browser/otto-context-health.spec.ts --workers=1 --retries=0 --max-failures=1
              ;;
            preview)
              npm run test:e2e --workspace=@getpaseo/app -- e2e/browser/otto-preview.spec.ts --workers=1 --retries=0 --max-failures=1
              ;;
            artifacts)
              npm run test:e2e --workspace=@getpaseo/app -- e2e/browser/otto-artifacts.spec.ts --workers=1 --retries=0 --max-failures=1
              ;;
            workflows)
              npm run test:e2e --workspace=@getpaseo/app -- e2e/browser/otto-workflows.spec.ts --workers=1 --retries=0 --max-failures=1
              ;;
            architectural-views)
              npm run test:e2e --workspace=@getpaseo/app -- e2e/browser/otto-architectural-views.spec.ts --workers=1 --retries=0 --max-failures=1
              ;;
            schedules)
              npm run test:e2e --workspace=@getpaseo/app -- e2e/browser/otto-schedules.spec.ts e2e/browser/schedules-edit-model-hydration.spec.ts e2e/browser/schedules-project-target.spec.ts e2e/browser/schedules-relative-time.spec.ts --workers=1 --retries=0 --max-failures=1
              ;;
            terminal)
              npm run test:e2e --workspace=@getpaseo/app -- e2e/browser/otto-terminal.spec.ts --workers=1 --retries=0 --max-failures=1
              ;;
            editor)
              # Exercise the changed flow first; retain every baseline gate and its proof.
              npm run test:e2e --workspace=@getpaseo/app -- e2e/browser/otto-editor.spec.ts --output=test-results/editor-flow --workers=1 --retries=0 --max-failures=1
              npm run test:e2e --workspace=@getpaseo/app -- e2e/browser/pane-find.spec.ts --output=test-results/paseo-find --workers=1 --retries=0 --max-failures=1
              npm run test:e2e --workspace=@getpaseo/app -- e2e/browser/file-editing.spec.ts --output=test-results/paseo-files --workers=1 --retries=0 --max-failures=1
              ;;
            speech)
              # Preserve existing content renderers and their lifecycle inside the inset frame.
              npm run test:e2e --workspace=@getpaseo/app -- e2e/browser/otto-speech.spec.ts e2e/browser/mermaid-fullscreen.spec.ts e2e/browser/mermaid-streaming.spec.ts e2e/browser/streaming-markdown.spec.ts e2e/browser/agent-tab-image-stability.spec.ts --workers=1 --retries=0 --max-failures=1
              ;;
            *) echo "Unknown diagnostic journey" >&2; exit 1 ;;
          esac
          ACCEPTANCE
        env:
          E2E_WORKERS: "1"
          OTTO_ACCEPTANCE_JOURNEY: ${{ github.event_name == 'workflow_dispatch' && inputs.journey || 'all' }}
          OTTO_ACCEPTANCE_SHARD: ${{ matrix.shard }}
      - name: Retain screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: otto-app-acceptance-${{ matrix.shard }}
          path: |
            packages/app/test-results/
            packages/app/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
