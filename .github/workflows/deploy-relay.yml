name: Deploy Relay

on:
  # Manual-only: a relay deploy replaces live WebSocket behavior and must be a
  # deliberate operator action, never a side effect of a release or main push.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: node scripts/npm-retry.mjs ci --workspace=@otto-code/relay --include-workspace-root

      - name: Typecheck
        run: npm run typecheck --workspace=@otto-code/relay

      - name: Deploy worker
        run: cd packages/relay && npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
