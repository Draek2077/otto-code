name: Release Notes Sync

on:
  push:
    tags:
      - "v*"
    branches:
      - main
    paths:
      - "CHANGELOG.md"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to sync (e.g. v0.1.14). Leave empty to use top changelog entry."
        required: false
        type: string
      create_if_missing:
        description: "Create release if missing (normally only needed for tag events)."
        required: false
        default: false
        type: boolean

# This workflow never creates the release on a tag push: Desktop Release owns
# creation for a `v*` tag and this one waits for it below. Two workflows both
# running `gh release create` for one tag both succeed (GitHub does not enforce
# tag_name uniqueness on create) and every later PATCH then fails with 422
# already_exists, which is exactly how 0.7.3 broke.
#
# The three workflows used to share one repo-wide concurrency group to
# serialize instead. Do not restore it: a group holds at most ONE pending job,
# so a third arrival cancels the job already waiting, and downstream jobs treat
# a cancelled lock as "skip me". See scripts/ensure-github-release.mjs.
concurrency:
  group: release-notes-sync-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  sync-release-notes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Wait for the release to exist
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/ensure-github-release.mjs \
            --tag "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --mode wait

      - name: Sync release body from changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          INPUT_TAG: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && github.ref_name || github.event.inputs.tag }}
          INPUT_CREATE_IF_MISSING: ${{ github.event.inputs.create_if_missing }}
        shell: bash
        run: |
          set -euo pipefail

          args=(--repo "$REPO")

          if [ -n "${INPUT_TAG:-}" ]; then
            args+=(--tag "$INPUT_TAG")
          fi

          # A tag push deliberately does NOT create: the wait step above already
          # confirmed Desktop Release created it, and a second creator is how a
          # tag ends up with two releases and a permanently 422-ing update.
          create_if_missing="false"
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "${INPUT_CREATE_IF_MISSING:-false}" = "true" ]; then
            create_if_missing="true"
          fi

          if [ "$create_if_missing" = "true" ]; then
            args+=(--create-if-missing)
          fi

          node scripts/sync-release-notes-from-changelog.mjs "${args[@]}"
