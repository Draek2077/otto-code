name: Android APK Release

# Builds the sideloadable release APK ON THIS RUNNER (expo prebuild + gradle),
# not on EAS, and attaches it to the GitHub Release.
#
# It used to shell out to `eas build --profile production-apk`. EAS's free tier
# allows 15 Android builds a month shared across every Android workflow, and the
# budget was exhausted on 2026-07-12 — 0.5.2 through 0.7.1 shipped with no
# Android artifact at all, and a quota-refused run still burns a versionCode.
# Building here is unlimited and removes the need to ration releases.
#
# This does not affect Play: the AAB goes down android-play-release.yml, and
# Play App Signing already means the store APK and this sideload APK carry
# different signatures.
#
# Requires four repo secrets (the same keystore EAS uses, so this APK installs
# as a drop-in update over an EAS-built Otto — a different key would force
# users to uninstall first):
#   - ANDROID_KEYSTORE_BASE64      base64 of the .jks from `eas credentials`
#   - ANDROID_KEYSTORE_PASSWORD    keystore password
#   - ANDROID_KEY_ALIAS            key alias
#   - ANDROID_KEY_PASSWORD         key password
# Without them the signing step fails loudly rather than shipping an unsigned or
# debug-signed APK.

on:
  push:
    tags:
      - "v*"
      - "android-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (e.g. v0.1.0)"
        required: true
        type: string

concurrency:
  group: android-apk-release-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  SOURCE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}

jobs:
  # Its own job purely so the shared lock below is held for seconds instead of
  # for the whole APK build. Leaving this as a step inside publish-android-apk
  # would make Desktop Release wait out a fifteen-minute gradle run to create
  # the release it is about to publish into.
  ensure-release:
    # Shared with desktop-release.yml and release-notes-sync.yml. All three
    # ensure this release exists, and a `v*` tag starts all three at once.
    # GitHub does NOT enforce tag_name uniqueness on create, so two concurrent
    # `gh release create` calls both succeed and leave two releases on one tag;
    # from then on every PATCH fails with 422 already_exists, which is how a
    # duplicate created here surfaces as a Release Notes Sync failure two
    # workflows later (0.7.3, two creates 82ms apart). Uniqueness IS enforced on
    # update, so the damage is only visible after the fact. Concurrency group
    # names are repo-wide, not workflow-scoped, so an identical string across
    # workflows serializes these jobs and the loser then takes its existing
    # "already exists, skipping" path. Must stay byte-identical in all three.
    concurrency:
      group: otto-release-ensure-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

      - name: Resolve release tag
        shell: bash
        run: node scripts/emit-release-env.mjs --source-tag "$SOURCE_TAG" >> "$GITHUB_ENV"

      - name: Ensure GitHub release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            exit 0
          fi

          release_args=(
            release create "$RELEASE_TAG"
            --repo "${{ github.repository }}"
            --title "Otto $RELEASE_TAG"
            --notes ""
          )

          if [[ "$IS_PRERELEASE" == "true" ]]; then
            release_args+=(--prerelease)
          fi

          if ! gh "${release_args[@]}"; then
            echo "Release creation raced with another workflow; continuing."
          fi

  publish-android-apk:
    needs: ensure-release
    permissions:
      contents: write
      packages: read
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

      - name: Resolve release tag
        shell: bash
        run: node scripts/emit-release-env.mjs --source-tag "$SOURCE_TAG" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v5

      - name: Install JS dependencies
        run: npm ci

      # What EAS ran as eas-build-post-install. The webview bundles are generated
      # sources: the committed copies go stale, and prebuild does not rebuild them.
      - name: Build workspace deps and webview bundles
        run: npm run eas-build-post-install --workspace=@otto-code/app

      - name: Prebuild the Android project
        env:
          APP_VARIANT: production
        run: npx expo prebuild --platform android --clean --non-interactive
        working-directory: packages/app

      # `-Pandroid.injected.version.code` is a NO-OP for assembleRelease under
      # AGP 8 — it silently yields versionCode 1, which Android refuses to
      # install over an existing Otto. Write it into the generated build.gradle
      # instead. The file is gitignored (prebuild regenerates it), so nothing
      # tracked changes here.
      #
      # versionCode is derived from the version rather than a remote counter:
      # major*10000 + minor*100 + patch, so 0.7.2 -> 702. Monotonic across
      # releases and reproducible from the tag alone, unlike EAS's counter which
      # drifted to 50+ because refused builds still incremented it.
      - name: Set versionCode from the release version
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_VERSION%%-*}"
          IFS='.' read -r major minor patch <<< "$version"
          version_code=$(( major * 10000 + minor * 100 + patch ))
          echo "Using versionCode $version_code for $RELEASE_VERSION"

          gradle_file=packages/app/android/app/build.gradle
          perl -pi -e "s/versionCode\s+\d+/versionCode $version_code/" "$gradle_file"
          grep -n "versionCode" "$gradle_file"

      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "ANDROID_KEYSTORE_BASE64 is not set. Add the release keystore secrets" >&2
            echo "before tagging; see the header of this workflow." >&2
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      # Mirrors the eas.json production-apk gradleCommand exactly, lint tasks and
      # all. Signing properties are injected (unlike the version code, these do
      # work) and read straight from secrets, so nothing is written to disk or
      # echoed.
      - name: Assemble the release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        working-directory: packages/app/android
        run: |
          set -euo pipefail
          ./gradlew :app:assembleRelease \
            --no-parallel --max-workers=1 \
            -x lint -x lintVitalAnalyzeRelease -x lintVitalRelease \
            -x generateReleaseLintModel -x generateReleaseLintVitalModel \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.jks" \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"

      - name: Collect and verify the APK
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find packages/app/android/app/build/outputs/apk/release -name '*.apk' | head -n 1)"
          if [ -z "$apk" ]; then
            echo "No APK produced." >&2
            exit 1
          fi

          # Fail loudly on a debug-signed APK: it would install for nobody who
          # already has Otto, and the failure is otherwise silent until a user
          # tries to update.
          build_tools="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
          "$build_tools/apksigner" verify --print-certs "$apk" | tee "$RUNNER_TEMP/signer.txt"
          if grep -qi "CN=Android Debug" "$RUNNER_TEMP/signer.txt"; then
            echo "APK is debug-signed; refusing to publish." >&2
            exit 1
          fi
          "$build_tools/aapt2" dump badging "$apk" | head -n 1

          asset_name="otto-${RELEASE_TAG}-android.apk"
          asset_path="$RUNNER_TEMP/$asset_name"
          cp "$apk" "$asset_path"

          echo "asset_name=$asset_name" >> "$GITHUB_OUTPUT"
          echo "asset_path=$asset_path" >> "$GITHUB_OUTPUT"

      - name: Upload APK to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$RELEASE_TAG" "${{ steps.artifact.outputs.asset_path }}" --clobber --repo "${{ github.repository }}"
