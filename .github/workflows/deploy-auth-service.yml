name: Verify and deploy shared connector authentication

on:
  pull_request:
    paths:
      - "packages/auth-service/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-auth-service.yml"
  push:
    branches: [main]
    paths:
      - "packages/auth-service/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-auth-service.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read

concurrency:
  group: auth-service-${{ github.event.inputs.environment || 'staging' }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: node scripts/npm-retry.mjs ci --workspace=@otto-code/auth-service --include-workspace-root --ignore-scripts
      - run: npm run typecheck --workspace=@otto-code/auth-service
      - run: npm run lint -- packages/auth-service/src
      - run: npx vitest run packages/auth-service/src/grant.test.ts packages/auth-service/src/worker.test.ts --bail=1
      - run: npm run build --workspace=@otto-code/auth-service
      - run: npm run test:runtime --workspace=@otto-code/auth-service

  deploy:
    needs: verify
    # Bootstrap explicitly after reviewing domains, cost limits, vendor consent,
    # secret bindings and protected GitHub Environments. Merging code is inert.
    if: vars.AUTH_SERVICE_DEPLOY_ENABLED == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment: auth-${{ github.event.inputs.environment || 'staging' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: node scripts/npm-retry.mjs ci --workspace=@otto-code/auth-service --include-workspace-root --ignore-scripts
      - name: Deploy reviewed service
        run: npm run "deploy:$AUTH_ENVIRONMENT" --workspace=@otto-code/auth-service
        env:
          AUTH_ENVIRONMENT: ${{ github.event.inputs.environment || 'staging' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.AUTH_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Check deployed health
        run: |
          if [ "$AUTH_ENVIRONMENT" = production ]; then
            curl --fail --silent --show-error https://auth.otto-code.me/health
          else
            curl --fail --silent --show-error https://auth-staging.otto-code.me/health
          fi
        env:
          AUTH_ENVIRONMENT: ${{ github.event.inputs.environment || 'staging' }}
