name: Verify and deploy shared connector authentication

# Production only. There is no staging deployment of the auth service; the
# production Worker (otto-auth at auth.otto-code.me) is the only environment.

on:
  pull_request:
    paths:
      - "packages/auth-service/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-auth-service.yml"
  push:
    branches: [main]
    paths:
      - "packages/auth-service/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-auth-service.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auth-service-production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: node scripts/npm-retry.mjs ci --workspace=@otto-code/auth-service --include-workspace-root --ignore-scripts
      - run: npm run typecheck --workspace=@otto-code/auth-service
      - run: npm run lint -- packages/auth-service/src
      - run: npx vitest run packages/auth-service/src/grant.test.ts packages/auth-service/src/worker.test.ts --bail=1
      - run: npm run build:production --workspace=@otto-code/auth-service
      - run: npm run test:runtime --workspace=@otto-code/auth-service

  deploy:
    needs: verify
    # Stays off until the repository variable AUTH_SERVICE_DEPLOY_ENABLED is
    # "true". Deploys with the same repository CLOUDFLARE_API_TOKEN the website
    # uses; the account id is pinned in packages/auth-service/wrangler.toml.
    if: vars.AUTH_SERVICE_DEPLOY_ENABLED == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: node scripts/npm-retry.mjs ci --workspace=@otto-code/auth-service --include-workspace-root --ignore-scripts
      - name: Deploy reviewed service
        run: npm run deploy:production --workspace=@otto-code/auth-service
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Check deployed health
        run: curl --fail --silent --show-error https://auth.otto-code.me/health
