# OTTO(release): verify the existing Otto distribution identities.
name: Nix

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Update lockfile + Nix hash if stale
        run: ./scripts/update-nix.sh

      - name: Retain evaluated dependency inputs
        uses: actions/upload-artifact@v7
        with:
          name: nix-dependency-inputs
          path: |
            nix/npm-deps.hash
            package-lock.json

      - name: Verify existing Otto NixOS setup identity
        run: |
          nix eval --json --impure --expr 'let flake = builtins.getFlake (toString ./.); in import ./nix/otto/compatibility-check.nix { inherit flake; }'

      - name: Build Nix package
        run: nix build .#default -o result

      # OTTO(browser-host): prove the installed modules and immutable browser runtime together.
      - name: Smoke packaged Host Browser
        timeout-minutes: 3
        run: |
          export OTTO_HOST_BROWSER_EXECUTABLE
          OTTO_HOST_BROWSER_EXECUTABLE="$(nix eval --raw --impure --expr 'let flake = builtins.getFlake (toString ./.); in "${flake.inputs.nixpkgs.legacyPackages.x86_64-linux.chromium}/bin/chromium"')"
          node scripts/otto/host-browser-smoke.mjs "$(realpath result)/lib/paseo/packages/server/dist/server"

      - name: Smoke Nix daemon
        run: |
          set -euo pipefail

          export PASEO_HOME
          PASEO_HOME="$(mktemp -d)"
          export PASEO_LISTEN=127.0.0.1:6767

          WRAPPER_LOG="$PASEO_HOME/paseo-cli.log"

          cleanup() {
            if [[ -n "${DAEMON_PID:-}" ]] && kill -0 "$DAEMON_PID" 2>/dev/null; then
              kill "$DAEMON_PID"
              wait "$DAEMON_PID" || true
            fi
            rm -rf "$PASEO_HOME"
          }
          trap cleanup EXIT

          PASEO_WEB_UI_ENABLED=true PASEO_RELAY_ENABLED=false ./result/bin/otto daemon run >"$WRAPPER_LOG" 2>&1 &
          DAEMON_PID=$!

          deadline=$((SECONDS + 30))
          while (( SECONDS < deadline )); do
            if STATUS_JSON="$(./result/bin/otto daemon status --json)" \
              && jq -e '.connectedDaemon == "reachable"' <<<"$STATUS_JSON" >/dev/null; then
              echo "$STATUS_JSON"
              curl --fail --silent --show-error http://127.0.0.1:6767/ >"$PASEO_HOME/web-ui.html"
              [[ -s "$PASEO_HOME/web-ui.html" ]]
              if ! TERMINAL_JSON="$(./result/bin/otto terminal create --cwd "$PASEO_HOME" --name nix-smoke --json)"; then
                break
              fi
              TERMINAL_ID="$(jq -er '.id' <<<"$TERMINAL_JSON")"
              ./result/bin/otto terminal send-keys "$TERMINAL_ID" 'PATH= "$PASEO_HOOK_CLI" --version && printf "nix-terminal-%s\n" ok' Enter
              deadline=$((SECONDS + 15))
              while (( SECONDS < deadline )); do
                if ./result/bin/otto terminal capture "$TERMINAL_ID" --json \
                  | jq -e '.lines | any(. == "nix-terminal-ok")' >/dev/null; then
                  ./result/bin/otto terminal kill "$TERMINAL_ID"
                  exit 0
                fi
                sleep 1
              done
              echo "Nix terminal did not execute the command."
              break
            fi

            if ! kill -0 "$DAEMON_PID" 2>/dev/null; then
              echo "Nix daemon exited before becoming reachable."
              break
            fi

            sleep 1
          done

          echo "::group::daemon.log"
          cat "$PASEO_HOME/daemon.log" 2>/dev/null || echo "<missing>"
          echo "::endgroup::"

          echo "::group::otto daemon run stdout/stderr"
          cat "$WRAPPER_LOG" 2>/dev/null || echo "<missing>"
          echo "::endgroup::"

          echo "::group::otto daemon status"
          ./result/bin/otto daemon status || true
          echo "::endgroup::"

          exit 1

      - name: Build Nix desktop package
        run: nix build .#desktop -o result-desktop

  build-desktop-darwin:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Update lockfile + Nix hash if stale
        run: ./scripts/update-nix.sh

      - name: Build Nix desktop package
        run: nix build .#desktop -o result-desktop

      - name: Verify macOS application bundle
        run: |
          set -euo pipefail

          app="result-desktop/Applications/Otto.app"
          test -x "$app/Contents/MacOS/Otto"
          test -L result-desktop/bin/otto-desktop
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")" = "ai.ottocode.desktop"
          find "$app" -name Info.plist -print0 | xargs -0 -n 1 plutil -lint
