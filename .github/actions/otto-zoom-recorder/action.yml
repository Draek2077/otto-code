name: Otto Zoom Recorder
description: Freeze and smoke-test the host-local meeting recorder on native Windows or Linux x64.
runs:
  using: composite
  steps:
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: packages/desktop/resources/zoom-recorder/requirements-build.txt
    - shell: bash
      run: python -m pip install -r packages/desktop/resources/zoom-recorder/requirements-build.txt
    - shell: bash
      run: python -m unittest discover -s packages/desktop/resources/zoom-recorder/tests
    - shell: bash
      run: npm run build:zoom-recorder --workspace=@getpaseo/desktop
