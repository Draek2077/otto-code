version: 2

# Why this exists: the actions in .github/workflows/ drifted three majors behind before anyone
# noticed, and the only signal was a Node 20 deprecation annotation buried in every run's log.
# Grouping keeps that from turning into fourteen separate PRs a week.
#
# npm is deliberately absent. Routine version drift across 10+ workspaces would bury the signal,
# and the Electron/Expo/React Native pins break in ways CI does not always catch. npm is covered
# by Dependabot *security* updates instead, which are a repository setting rather than a block
# here (Settings > Code security > Dependabot). Adding a `package-ecosystem: npm` entry below
# would turn that quiet advisory feed into full version-bump PRs, which is not what we want.
#
# Paused 2026-09-14: CI on main is red, so Dependabot PRs could not be verified and were closed.
# Dependency and action bumps are handled by hand for now; automated security fix PRs are also
# off in repository settings (alerts stay on). Restore a nonzero limit to resume PRs.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    # 0 disables version-update PRs without removing the config.
    open-pull-requests-limit: 0
    commit-message:
      prefix: "chore(ci)"
    ignore:
      # gradle/actions v6 moves caching into gradle-actions-caching, a proprietary
      # component under Gradle's commercial Terms of Use. We hold at v5, which is
      # Node 24 native and MIT. Revisit only as a deliberate licensing decision.
      - dependency-name: gradle/actions
        update-types:
          - version-update:semver-major
    groups:
      # Majors land on their own so the release notes actually get read; everything else
      # rides in one PR that CI either passes or doesn't.
      actions-minor:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
